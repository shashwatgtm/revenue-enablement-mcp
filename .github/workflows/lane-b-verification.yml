name: Lane B branch verification
on:
  push:
    branches: [codex/round4-20261102]
    paths:
      - 'src/**'
      - 'dist/**'
      - 'tests/**'
      - '.github/workflows/lane-b-verification.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test --test-concurrency=1 tests/*.test.mjs
